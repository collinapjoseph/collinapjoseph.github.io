<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Dicee</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Indie+Flower|Lobster"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Dice Roller</h1>
      <h2 class="winnerLabel">Click button to roll.</h2>

      <button class="diceRollButton">Roll Dice</button>

      <div class="player-container">
        <div class="dice">
          <p>Player 1</p>
          <img class="img1" src="./images/dice6.png" />
        </div>

        <div class="dice">
          <p>Player 2</p>
          <img class="img2" src="./images/dice6.png" />
        </div>
      </div>
    </div>

    <footer>Collin Joseph, 2025</footer>
    <script src="./dice_script.js" charset="utf-8"></script>
  </body>
</html>
