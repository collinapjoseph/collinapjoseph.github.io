<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Mario</title>
    <style>
        body{
            background-color: black;
            margin: 0;
        }

        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .canvas{
            display: grid;
            grid-template-rows: repeat(18, 50px);
            grid-template-columns: repeat(14, 50px);
            background-color: #555;
        }

        @media (max-width: 700px){
           .canvas{
                grid-template-rows: repeat(18, 25px);
                grid-template-columns: repeat(14, 25px);
           } 
        }

        .red{
            background-color: darkred;
        }

        .blue{
            background-color: darkblue;
        }

        .black{
            background-color: black;
        }

        .yellow{
            background-color: goldenrod;
        }

        .brown{
            background-color: #543700;
        }

        #r1{grid-area: 2/5/2/10}
        #r2{grid-area: 3/4/3/13}
        #b1{grid-area: 4/4/5/7}
        #y1{grid-area: 4/7/9/9}
        #l1{grid-area: 4/9/6/10}
        #y2{grid-area: 4/10/6/11}        
        #b2{grid-area: 5/3/7/4}
        #y3{grid-area: 5/4/7/5}
        #b3{grid-area: 5/5/7/6}
        #y4{grid-area: 5/6/6/7}
        #b4{grid-area: 6/6/7/7}
        #b5{grid-area: 7/4/8/5}
        #y5{grid-area: 7/5/9/7}
        #y6{grid-area: 6/9/7/10}
        #l2{grid-area: 6/10/7/11}
        #y7{grid-area: 5/11/7/13}
        #y8{grid-area: 6/13/7/14}
        #l3{grid-area: 7/9/8/13}
        #y9{grid-area: 8/9/9/11}
        #r3{grid-area: 9/4/13/5}
        #r4{grid-area: 9/5/12/6}
        #u1{grid-area: 9/6/12/7}
        #r5{grid-area: 9/7/11/9}
        #u2{grid-area: 9/9/12/10}
        #r6{grid-area: 9/10/12/11}
        #r7{grid-area: 9/11/13/12}
        #r8{grid-area: 10/3/12/4}
        #r9{grid-area: 11/2/12/3}
        #u3{grid-area: 11/7/15/9}
        #r10{grid-area: 10/12/12/13}
        #r11{grid-area: 11/13/12/14}
        #y10{grid-area: 12/2/15/4}
        #y11{grid-area: 13/4/14/5}
        #u4{grid-area: 12/5/16/6}
        #y12{grid-area: 12/6/13/7}
        #y13{grid-area: 12/9/13/10}
        #u5{grid-area: 12/10/16/11}
        #y14{grid-area: 13/11/14/12}
        #y15{grid-area: 12/12/15/14}
        #u6{grid-area: 14/4/16/5}
        #u7{grid-area: 14/11/16/12}
        #u8{grid-area: 13/6/16/7}
        #u9{grid-area: 13/9/16/10}
        #b6{grid-area: 16/3/17/6}
        #b7{grid-area: 16/10/17/13}
        #b8{grid-area: 17/2/18/6}
        #b9{grid-area: 17/10/18/14}
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas">
            <div class="red" id="r1"></div>
            <div class="red" id="r2"></div>
            <div class="brown" id="b1"></div>
            <div class="yellow" id="y1"></div>
            <div class="black" id="l1"></div>
            <div class="yellow" id="y2"></div>
            <div class="brown" id="b2"></div>
            <div class="yellow" id="y3"></div>
            <div class="brown" id="b3"></div>
            <div class="yellow" id="y4"></div>
            <div class="brown" id="b4"></div>
            <div class="brown" id="b5"></div>
            <div class="yellow" id="y5"></div>
            <div class="yellow" id="y6"></div>
            <div class="black" id="l2"></div>
            <div class="yellow" id="y7"></div>
            <div class="yellow" id="y8"></div>
            <div class="black" id="l3"></div>
            <div class="yellow" id="y9"></div>
            <div class="red" id="r3"></div>
            <div class="red" id="r4"></div>
            <div class="blue" id="u1"></div>
            <div class="red" id="r5"></div>
            <div class="blue" id="u2"></div>
            <div class="red" id="r6"></div>
            <div class="red" id="r7"></div>
            <div class="red" id="r8"></div>
            <div class="red" id="r9"></div>
            <div class="blue" id="u3"></div>
            <div class="red" id="r10"></div>
            <div class="red" id="r11"></div>
            <div class="yellow" id="y10"></div>
            <div class="yellow" id="y11"></div>
            <div class="blue" id="u4"></div>
            <div class="yellow" id="y12"></div>
            <div class="yellow" id="y13"></div>
            <div class="blue" id="u5"></div>
            <div class="yellow" id="y14"></div>
            <div class="yellow" id="y15"></div>
            <div class="blue" id="u6"></div>
            <div class="blue" id="u7"></div>
            <div class="blue" id="u8"></div>
            <div class="blue" id="u9"></div>
            <div class="brown" id="b6"></div>
            <div class="brown" id="b7"></div>
            <div class="brown" id="b8"></div>
            <div class="brown" id="b9"></div>
        </div>
    </div>
</body>
</html>
